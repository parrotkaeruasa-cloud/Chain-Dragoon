.ft{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 2px}

.sh{width:46px;height:46px;border-radius:50%;background:#495057;font-size:19px;padding:0}

.mc{background:#1a0d2b;border:3px solid #c9184a;box-shadow:0 0 24px #c9184a88;border-radius:20px;padding:22px;width:100%;max-width:340px}
